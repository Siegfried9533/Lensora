# Cấu hình Server
server.port=8080
server.address=0.0.0.0

spring.application.name=backend

# Cấu hình Cơ sở dữ liệu (PostgreSQL - LensoraDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/LensoraDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hiển thị các câu lệnh SQL được thực thi trong console để dễ dàng debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chỉ định phương thức SQL cho PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cấu hình Jackson để Android nhận định dạng ngày tháng chuẩn
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# Cấu hình flyway để quản lý migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Chỉ validate schema sau khi Flyway tạo bảng
spring.jpa.hibernate.ddl-auto=validate

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Ghi log
logging.level.com.camerashop=DEBUG
logging.level.org.springframework.security=DEBUG

# URL Frontend (cho các liên kết trong email)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:8081}

# Cấu hình Email (env-driven, không hardcode)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@lensora.local}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cấu hình GHN
app.ghn.api-url=${APP_GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/}
app.ghn.shop-id=${APP_GHN_SHOP_ID:0}
app.ghn.token=${APP_GHN_TOKEN:}
app.ghn.district-id=${APP_GHN_DISTRICT_ID:0}

# Cấu hình MoMo (Sandbox)
app.momo.partner-code=${APP_MOMO_PARTNER_CODE:}
app.momo.access-key=${APP_MOMO_ACCESS_KEY:}
app.momo.secret-key=${APP_MOMO_SECRET_KEY:}
app.momo.url=${APP_MOMO_URL:https://test-payment.momo.vn}
app.momo.redirect-url=${APP_MOMO_REDIRECT_URL:http://localhost:8081/payment/momo/redirect}
app.momo.ipn-url=${APP_MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}

# Cấu hình DeepSeek API
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
deepseek.api-key=${DEEPSEEK_API_KEY:}
